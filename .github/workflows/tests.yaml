name: Run Project Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_data_classes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] CITY CLASS"
        run: |
          python -m unittest tests/test_city_class.py

  test_bike_class:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] CLI"
        run: |
          python -m unittest tests/test_bike_class.py

  test_station_class:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] STATION"
        run: |
          python -m unittest tests/test_station_class.py

  test_cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] CLI"
        run: |
          python -m unittest tests/test_cli.py

  test_postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] POSTGRES"
        run: |
          python -m unittest tests/test_postgres.py

  test_nextbike_api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection/data_collection

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collection/data_collection/requirements.txt

      - name: Install dependencies (cached)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[TEST] POSTGRES"
        run: |
          python -m unittest tests/test_nextbikeapi.py

  test_visualization_api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nextbike_api_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nextbike_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: visualization
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: nextbike_api_test
      DB_USER: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: visualization/requirements.txt

      - name: Install visualization dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v

  test_processing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nextbike_processing_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nextbike_processing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: processing
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: nextbike_processing_test
      DB_USER: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: processing/requirements.txt

      - name: Install processing dependencies
        run: python -m pip install -r requirements.txt

      - name: Run processing unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
